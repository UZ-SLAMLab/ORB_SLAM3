# Builds the orbslam3 conda package (linux-64, osx-arm64, win-64) on every push to master, and publishes it to
# https://prefix.dev/vslamlab/vslamlab when a version tag (vX.Y) is pushed.
# Publishing uses prefix.dev trusted publishing (OIDC): prefix.dev > Settings > Repository Access > GitHub,
# repository VSLAM-LAB/orbslam3, workflow conda-package.yml, read/write on vslamlab/vslamlab. No API key is stored.
#
# Release: bump `version` in pixi.toml, push to master, check it (VSLAM-LAB orbslam3-dev),
# then `git tag vX.Y && git push origin vX.Y`.
name: conda-package

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-64 }
          - { os: macos-latest, platform: osx-arm64 }
          - { os: windows-latest, platform: win-64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        run: |
          python3 - <<'EOF'
          import os, sys, tomllib
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          version = tomllib.load(open('pixi.toml', 'rb'))['package']['version']
          if tag != version:
              sys.exit(f'tag v{tag} does not match pixi.toml [package] version {version}')
          print(f'version {tag} OK')
          EOF

      # --clean: pixi reuses its build directory otherwise, and stale files end up in the package
      - name: Build into a local channel
        run: pixi publish --clean --to "${{ github.workspace }}/channel"

      # Runs the executables from a fresh environment: checks they are packaged and all their libraries resolve
      - name: Test
        run: |
          for exe in vslamlab_orbslam3_mono vslamlab_orbslam3_rgbd vslamlab_orbslam3_stereo \
                     vslamlab_orbslam3_mono_vi vslamlab_orbslam3_rgbd_vi vslamlab_orbslam3_stereo_vi \
                     vslamlab_orbslam3_mono_stream; do
            pixi exec -c "${{ github.workspace }}/channel" -c https://prefix.dev/conda-forge -c https://prefix.dev/vslamlab/vslamlab -s orbslam3 -- "$exe" --help
          done

      - uses: actions/upload-artifact@v7
        with:
          name: orbslam3-${{ matrix.platform }}
          path: channel/${{ matrix.platform }}/orbslam3-*.conda
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # trusted publishing to prefix.dev
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: orbslam3-*
          merge-multiple: true
          path: packages

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      # --skip-existing: a re-run after a partial upload never overwrites a published file
      - name: Upload to prefix.dev
        run: |
          ls -l packages
          [ "$(ls packages/*.conda | wc -l)" -eq 3 ] || { echo "expected 3 packages"; exit 1; }
          pixi exec rattler-build upload prefix --skip-existing --channel vslamlab/vslamlab packages/*.conda
